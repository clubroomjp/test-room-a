<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>embed</title>
</head>
<body>
<iframe id="embedded" title="埋め込み" style="width:100%;height:80vh;border:0"></iframe>
<script>
const params = new URLSearchParams(location.search);
const viewer = params.get("viewer");
if (viewer !== null && (viewer.startsWith("https:") || viewer.startsWith("http://127.0.0.1"))) {
  document.getElementById("embedded").src = viewer;
}
</script>
</body>
</html>
